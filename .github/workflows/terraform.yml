# Infrastructure changes (infra/).
#   pull request touching infra/**  -> fmt, validate, tflint, plan for staging and prod; plan posted as a PR comment
#   merge to main touching infra/** -> apply staging, then prod, each after approval in the
#                                      "infrastructure" GitHub Environment (required reviewers)
#
# Repository variables: TF_PLAN_ROLE_ARN, TF_APPLY_ROLE_ARN (outputs of infra/bootstrap),
# ALERT_EMAIL (optional, subscribed to alarms). bootstrap/ itself is applied by hand.
name: Terraform

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4

      - name: Format
        run: terraform fmt -check -recursive -diff ../..

      - name: AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --recursive

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          exit $code

      - name: Comment the plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.env }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = `infra/envs/${process.env.ENVIRONMENT}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(no plan output)';
            const max = 60000;
            if (plan.length > max) plan = '…(truncated)…\n' + plan.slice(-max);
            const marker = `<!-- terraform-plan-${process.env.ENVIRONMENT} -->`;
            const body = `${marker}\n### Terraform plan: \`${process.env.ENVIRONMENT}\` (${process.env.OUTCOME})\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body && c.body.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: infrastructure
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        env: [staging, prod]
    concurrency:
      group: terraform-apply-${{ matrix.env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: AWS credentials (OIDC, apply)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -lockfile=readonly

      - name: Plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Apply
        run: terraform apply -no-color -lock-timeout=5m tfplan
